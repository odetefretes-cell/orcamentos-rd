name: Publicar no Firebase Hosting

# Publica o site no Firebase (obs-fretes.web.app) automaticamente a cada
# atualização na branch main. A credencial fica guardada com segurança nos
# "Secrets" do repositório (FIREBASE_SA_OBS_FRETES), nunca no código.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "firebase-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar no Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA_OBS_FRETES }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting --project obs-fretes --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
